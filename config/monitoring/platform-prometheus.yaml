## Use when LCS is deployed in an openshift-* namespace (e.g. openshift-lcs).
## Platform Prometheus (prometheus-k8s) scrapes directly.
## Requires: oc label namespace <your-openshift-namespace> openshift.io/cluster-monitoring=true
## PROMETHEUS_BACKEND env var: not needed (default)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-k8s
  namespace: <your-openshift-namespace>
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-k8s
  namespace: <your-openshift-namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: openshift-monitoring
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lcs-monitor
  namespace: <your-openshift-namespace>
spec:
  selector:
    matchLabels:
      app: lcs
  endpoints:
    - targetPort: 8080
      path: /metrics
      interval: 30s
