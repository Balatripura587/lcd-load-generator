---
apiVersion: batch/v1
kind: Job
metadata:
  name: lcs-load-generator
  namespace: lcs-perf-testing
  labels:
    app: lcs-load-generator
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: lcs-load-generator
    spec:
      restartPolicy: Never
      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       - labelSelector:
      #           matchExpressions:
      #             - key: app.kubernetes.io/component
      #               operator: In
      #               values:
      #                 - application-server
      #         topologyKey: kubernetes.io/hostname
      containers:
        - name: lcs-load-generator
          image: quay.io/rh-ee-bbodapat/lcs-load-generator:latest
          env:
            - name: KUBECONFIG
              value: "/etc/kubeconfig/kubeconfig"
            - name: LCS_HOST
              value: "http://lcs.lcs-perf-testing.svc.cluster.local:8080"
            - name: LCS_TOKEN
              value: ""
            - name: LCS_PROVIDER
              value: "openai"
            - name: LCS_MODEL
              value: "granite-3.1-8b-instruct"
            - name: LOCUST_USERS
              value: "5"
            - name: LOCUST_RUN_TIME
              value: "1m"
            - name: LOCUST_PROCESSES
              value: "1"
            - name: TEST_UUID
              value: ""
            - name: REQUEST_TIMEOUT
              value: "120"
            - name: RESULTS_DIR
              value: "/results"
            - name: QUESTIONS_FILE
              value: "/opt/lcs-load-generator/locust/assets/questions.yaml"
            - name: ES_SERVER
              value: ""
            - name: ES_INDEX
              value: "lcs-perf-results"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: results
              mountPath: /results
            - name: kubeconfig-volume
              mountPath: /etc/kubeconfig
              readOnly: true
          imagePullPolicy: Always
      volumes:
        - name: results
          emptyDir: {}
        - name: kubeconfig-volume
          secret:
            secretName: kubeconfig-secret
